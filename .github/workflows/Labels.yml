name: PR Review Comment Classifier
'on':
  pull_request_review_comment:
    types:
      - created
      - edited
permissions:
  pull-requests: write
jobs:
  validate-comment:
    if: github.event.comment.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Review Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |


            /******************************************************************

             * CONTEXT

             ******************************************************************/

            const owner = context.repo.owner;

            const repo = context.repo.repo;

            const prNumber = context.payload.pull_request.number;


            const comment = context.payload.comment;


            const commentId = comment.id;

            const reviewer = comment.user.login;

            const body = comment.body || "";

            const action = context.payload.action;


            console.log("========== DEBUG ==========");

            console.log("Action :", action);

            console.log("Comment:", commentId);

            console.log("Author :", reviewer);


            /******************************************************************

             * NORMALIZE

             ******************************************************************/


            const normalized = body

              .replace(/\*\*/g, "")

              .replace(/\r/g, "")

              .toUpperCase()

              .trim();


            console.log(normalized);


            /******************************************************************

             * LABELS

             ******************************************************************/


            const TYPE_LABELS = [

              "[QUESTION]",

              "[DEFECT]"

            ];


            const RANKING = [

              "[MAJOR]",

              "[MINOR]"

            ];


            const CLASSIFICATIONS = [

              "[MISSING]",

              "[EXTRA/SUPERFLUOUS]",

              "[AMBIGUOUS]",

              "[INCONSISTENT]",

              "[IMPROVEMENT DESIRABLE]",

              "[NOT CONFORMING TO STANDARDS]",

              "[RISK-PRONE]",

              "[FACTUALLY INCORRECT]",

              "[NOT IMPLEMENTABLE]",

              "[EDITORIAL]"

            ];


            /******************************************************************

             * DETECTION

             ******************************************************************/


            const hasQuestion = /\[QUESTION\]/.test(normalized);


            const hasDefect = /\[DEFECT\]/.test(normalized);


            const hasRanking =

              RANKING.some(label => normalized.includes(label));


            const hasClassification =

              CLASSIFICATIONS.some(label => normalized.includes(label));


            console.log({

              hasQuestion,

              hasDefect,

              hasRanking,

              hasClassification

            });


            /******************************************************************

             * UNIQUE BOT MARKER

             ******************************************************************/


            const marker =

              ``;


            /******************************************************************

             * FIND EXISTING BOT REPLY

             ******************************************************************/


            async function findBotReply() {


              let page = 1;

              let comments = [];


              while (true) {


                const response =

                  await github.rest.pulls.listReviewComments({


                    owner,

                    repo,

                    pull_number: prNumber,

                    per_page: 100,

                    page


                  });


                comments.push(...response.data);


                if (response.data.length < 100)

                  break;


                page++;

              }


              console.log(

                `Fetched ${comments.length} review comments`

              );


              return comments.find(c =>

                c.user.login === "github-actions[bot]" &&

                c.body &&

                c.body.includes(marker)

              );


            }


            /******************************************************************

             * DELETE BOT REPLY

             ******************************************************************/


            async function deleteReply() {


              const existing = await findBotReply();


              if (!existing) {


                console.log("No reply to delete.");


                return;


              }


              await github.rest.pulls.deleteReviewComment({


                owner,

                repo,

                comment_id: existing.id


              });


              console.log("Reminder deleted.");


            }


            /******************************************************************

             * CREATE OR UPDATE BOT REPLY

             ******************************************************************/


            async function postOrUpdateReply(message) {


              const existing = await findBotReply();


              const body =


              `${marker}


              ${message}`;


              if (existing) {


                console.log("Updating reminder");


                await github.rest.pulls.updateReviewComment({


                  owner,

                  repo,

                  comment_id: existing.id,

                  body


                });


              } else {


                console.log("Creating reminder");


                await github.rest.pulls.createReplyForReviewComment({


                  owner,

                  repo,

                  pull_number: prNumber,

                  comment_id: commentId,

                  body


                });


              }


            }


            /******************************************************************

             * VALIDATION STARTS BELOW

             ******************************************************************/

                         /******************************************************************

             * CASE 1

             * No Type Label

             ******************************************************************/


            if (!hasQuestion && !hasDefect) {


              await postOrUpdateReply(


              `👋 @${reviewer}


              Your review comment is missing a **Type** label.


              | Type | Description |

              |------|-------------|

              | \`**[QUESTION]**\` | Ask for clarification |

              | \`**[DEFECT]**\` | Report an issue |


              If you choose **[DEFECT]**, you must also add:


              - one Ranking label

              - one Classification label


              > Edit your review comment. This reminder will disappear automatically.`


              );


              return;


            }


            /******************************************************************

             * CASE 2

             * QUESTION

             ******************************************************************/


            if (hasQuestion) {


              console.log("QUESTION detected");


              await deleteReply();


              return;


            }


            /******************************************************************

             * CASE 3

             * DEFECT

             ******************************************************************/


            if (hasDefect) {


              console.log("DEFECT detected");


              const missingRanking =

                !hasRanking;


              const missingClassification =

                !hasClassification;


              if (

                !missingRanking &&

                !missingClassification

              ) {


                console.log("DEFECT fully classified");


                await deleteReply();


                return;


              }
              let reminder =
              `👋 @${reviewer}
              Your **[DEFECT]** comment is incomplete.
              `;
              /**************************************************************
               * Ranking Missing
               **************************************************************/
              if (missingRanking) {
                reminder +=
              `## Ranking
              Choose exactly one:
              | Label | Meaning |
              |------|---------|
              | 🔴 **[MAJOR]** | Must fix before merge |
              | 🟡 **[MINOR]** | Small issue |
              `;
              }

              /**************************************************************
               * Classification Missing
               **************************************************************/
              if (missingClassification) {
                reminder +=
                `## Classification

                Choose exactly one:
                | Label | Meaning |
                |------|---------|
                | **[MISSING]** | Required code missing |
                | **[EXTRA/SUPERFLUOUS]** | Unnecessary code |
                | **[AMBIGUOUS]** | Unclear implementation |
                | **[INCONSISTENT]** | Inconsistent behaviour |
                | **[IMPROVEMENT DESIRABLE]** | Improvement suggested |
                | **[NOT CONFORMING TO STANDARDS]** | Standards violation |
                | **[RISK-PRONE]** | Risky implementation |
                | **[FACTUALLY INCORRECT]** | Incorrect logic |
                | **[NOT IMPLEMENTABLE]** | Suggestion cannot be implemented |
                | **[EDITORIAL]** | Grammar / formatting |
                `;
              }
              reminder +=
              `---
              Edit your review comment to include the missing labels.
              This reminder will be updated automatically and removed once the comment is valid.
              `;
              await postOrUpdateReply(reminder);
              return;
            }

            /******************************************************************
             * FALLBACK
             ******************************************************************/
            await deleteReply();

            /******************************************************************
             * END OF VALIDATION
             ******************************************************************/
            console.log("====================================");
            console.log("Validation completed successfully.");
            console.log("====================================");
