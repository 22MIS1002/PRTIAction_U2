name: Review Comment Classifier

on:
  pull_request_review_comment:
    types:
      - created
      - edited

permissions:
  pull-requests: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate and annotate review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = context.payload.comment;
            const pr = context.payload.pull_request;

            // --- Guard: ignore bot comments ---
            if (comment.user.login === 'github-actions[bot]') {
              console.log('Ignoring bot comment.');
              return;
            }

            // --- Guard: ignore reply comments ---
            if (comment.in_reply_to_id != null) {
              console.log('Ignoring reply comment.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const commentId = comment.id;
            const prNumber = pr.number;
            const body = comment.body || '';

            // --- Normalize Markdown saved replies ---
            // e.g. **[DEFECT]** → [DEFECT], *[MAJOR]* → [MAJOR]
            const normalized = body.replace(/\*+(\[[A-Z/ ]+\])\*+/g, '$1');

            // --- Extract labels ---
            const TYPE_LABELS = ['QUESTION', 'DEFECT'];
            const RANKING_LABELS = ['MAJOR', 'MINOR'];
            const CLASSIFICATION_LABELS = [
              'MISSING',
              'EXTRA/SUPERFLUOUS',
              'AMBIGUOUS',
              'INCONSISTENT',
              'IMPROVEMENT DESIRABLE',
              'NOT CONFORMING TO STANDARDS',
              'RISK-PRONE',
              'FACTUALLY INCORRECT',
              'NOT IMPLEMENTABLE',
              'EDITORIAL',
            ];

            function extractLabels(text, candidates) {
              return candidates.filter(label =>
                text.includes(`[${label}]`)
              );
            }

            const foundTypes = extractLabels(normalized, TYPE_LABELS);
            const foundRankings = extractLabels(normalized, RANKING_LABELS);
            const foundClassifications = extractLabels(normalized, CLASSIFICATION_LABELS);

            const hasType = foundTypes.length > 0;
            const isQuestion = foundTypes.includes('QUESTION');
            const isDefect = foundTypes.includes('DEFECT');
            const hasRanking = foundRankings.length > 0;
            const hasClassification = foundClassifications.length > 0;

            // --- Marker for finding existing bot reminder ---
            const MARKER = `<!-- review-classifier:${commentId} -->`;

            // --- Find existing bot reminder ---
            async function findExistingReminder() {
              const { data: reviews } = await github.rest.pulls.listReviewComments({
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100,
              });
              return reviews.find(r =>
                r.user.login === 'github-actions[bot]' &&
                r.body.includes(MARKER)
              ) || null;
            }

            // --- Delete bot reminder ---
            async function deleteReminder(reminder) {
              if (!reminder) return;
              await github.rest.pulls.deleteReviewComment({
                owner,
                repo,
                comment_id: reminder.id,
              });
              console.log(`Deleted reminder ${reminder.id}`);
            }

            // --- Create bot reminder as a reply ---
            async function createReminder(newBody) {
              await github.rest.pulls.createReplyForReviewComment({
                owner,
                repo,
                pull_number: prNumber,
                comment_id: commentId,
                body: newBody,
              });
              console.log('Created new reminder.');
            }

            // --- Update existing bot reminder ---
            async function updateReminder(reminder, newBody) {
              await github.rest.pulls.updateReviewComment({
                owner,
                repo,
                comment_id: reminder.id,
                body: newBody,
              });
              console.log(`Updated reminder ${reminder.id}`);
            }

            // --- Upsert (create or update) reminder ---
            async function upsertReminder(newBody) {
              const existing = await findExistingReminder();
              if (!existing) {
                await createReminder(newBody);
              } else if (existing.body !== newBody) {
                await updateReminder(existing, newBody);
              } else {
                console.log('Reminder unchanged, nothing to do.');
              }
            }

            // --- Table builders ---
            function typeTable() {
              return `## ⚠️ Type Label Required

            Please add one of the following type labels to your review comment:
            
            | Label | When to use |
            |-------|-------------|
            | **[QUESTION]** | You have a question or need clarification — not necessarily a defect |
            | **[DEFECT]** | You have identified an actual defect that must be addressed |

            ${MARKER}`;
                        }

            function rankingTable(currentClassifications) {
              const classificationNote = currentClassifications.length > 0
                ? `\n> ✅ Classification already set: **[${currentClassifications.join(', ')}]**\n`
                : '';
              return `## ⚠️ Ranking Required

            Please add one of the following ranking labels:
            
            | Label | Meaning |
            |-------|---------|
            | **[MAJOR]** | Must be fixed before merge — significant impact on correctness, security, or functionality |
            | **[MINOR]** | Should be fixed but not a blocker — style, minor issues, or low-risk improvements |
            ${classificationNote}
            ${MARKER}`;
                        }

            function classificationTable(currentRankings) {
              const rankingNote = currentRankings.length > 0
                ? `\n> ✅ Ranking already set: **[${currentRankings.join(', ')}]**\n`
                : '';
              return `## ⚠️ Classification Required

            Please add one of the following classification labels:
            
            | Label | Meaning |
            |-------|---------|
            | **[MISSING]** | Required element is absent |
            | **[EXTRA/SUPERFLUOUS]** | Element is present but not needed |
            | **[AMBIGUOUS]** | Meaning or intent is unclear |
            | **[INCONSISTENT]** | Conflicts with other parts of the code or spec |
            | **[IMPROVEMENT DESIRABLE]** | Works but could be significantly improved |
            | **[NOT CONFORMING TO STANDARDS]** | Violates coding standards or conventions |
            | **[RISK-PRONE]** | Likely to cause bugs or issues in the future |
            | **[FACTUALLY INCORRECT]** | Contains an error in logic or fact |
            | **[NOT IMPLEMENTABLE]** | Cannot be built as specified |
            | **[EDITORIAL]** | Typos, formatting, or documentation issues only |
            ${rankingNote}
            ${MARKER}`;
            }

            function statusTable(types, rankings, classifications) {
              const typeStatus = types.length > 0 ? `✅ ${types.map(t => `**[${t}]**`).join(', ')}` : '❌ Missing';
              const rankingStatus = rankings.length > 0 ? `✅ ${rankings.map(r => `**[${r}]**`).join(', ')}` : '❌ Missing';
              const classificationStatus = classifications.length > 0 ? `✅ ${classifications.map(c => `**[${c}]**`).join(', ')}` : '❌ Missing';

              return `## 📋 Current Status

            | Label Group | Status |
            |-------------|--------|
            | Type | ${typeStatus} |
            | Ranking | ${rankingStatus} |
            | Classification | ${classificationStatus} |
            
            ${MARKER}`;
            }

            // --- Build combined reminder body ---
            function buildReminderBody(sections) {
              return sections.join('\n\n---\n\n');
            }

            // --- Main Logic ---

            // Case 1: No type label
            if (!hasType) {
              const body = typeTable();
              await upsertReminder(body);
              return;
            }

            // Case 2: QUESTION — no reminder needed
            if (isQuestion) {
              const existing = await findExistingReminder();
              await deleteReminder(existing);
              return;
            }

            // Cases 3–6: DEFECT
            if (isDefect) {
              const needsRanking = !hasRanking;
              const needsClassification = !hasClassification;

              // Case 6: DEFECT + Ranking + Classification — all complete
              if (!needsRanking && !needsClassification) {
                const existing = await findExistingReminder();
                await deleteReminder(existing);
                return;
              }

              // Build sections based on what is missing
              const sections = [];

              if (needsRanking) {
                sections.push(rankingTable(foundClassifications));
              }

              if (needsClassification) {
                sections.push(classificationTable(foundRankings));
              }

              // Always append status table at the end (share one marker at end)
              // Re-build with a single marker at the very end
              const bodyParts = [];

              if (needsRanking) {
                bodyParts.push(`## ⚠️ Ranking Required

            Please add one of the following ranking labels:
            
            | Label | Meaning |
            |-------|---------|
            | **[MAJOR]** | Must be fixed before merge — significant impact on correctness, security, or functionality |
            | **[MINOR]** | Should be fixed but not a blocker — style, minor issues, or low-risk improvements |`);
            }

              if (needsClassification) {
                bodyParts.push(`## ⚠️ Classification Required

            Please add one of the following classification labels:
            
            | Label | Meaning |
            |-------|---------|
            | **[MISSING]** | Required element is absent |
            | **[EXTRA/SUPERFLUOUS]** | Element is present but not needed |
            | **[AMBIGUOUS]** | Meaning or intent is unclear |
            | **[INCONSISTENT]** | Conflicts with other parts of the code or spec |
            | **[IMPROVEMENT DESIRABLE]** | Works but could be significantly improved |
            | **[NOT CONFORMING TO STANDARDS]** | Violates coding standards or conventions |
            | **[RISK-PRONE]** | Likely to cause bugs or issues in the future |
            | **[FACTUALLY INCORRECT]** | Contains an error in logic or fact |
            | **[NOT IMPLEMENTABLE]** | Cannot be built as specified |
            | **[EDITORIAL]** | Typos, formatting, or documentation issues only |`);
              }

              // Status table
              const typeStatus = `✅ **[DEFECT]**`;
              const rankingStatus = hasRanking
                ? `✅ ${foundRankings.map(r => `**[${r}]**`).join(', ')}`
                : '❌ Missing';
              const classificationStatus = hasClassification
                ? `✅ ${foundClassifications.map(c => `**[${c}]**`).join(', ')}`
                : '❌ Missing';

              bodyParts.push(`## 📋 Current Status

            | Label Group | Status |
            |-------------|--------|
            | Type | ${typeStatus} |
            | Ranking | ${rankingStatus} |
            | Classification | ${classificationStatus} |`);
            
                          const fullBody = bodyParts.join('\n\n---\n\n') + `\n\n${MARKER}`;
                          await upsertReminder(fullBody);
                          return;
            }
