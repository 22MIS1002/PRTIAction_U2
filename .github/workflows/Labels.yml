name: PR Review Comment Classifier
on:
  pull_request_review_comment:
    types:
      - created
      - edited
permissions:
  pull-requests: write
jobs:
  review-comment-classifier:
    if: github.event.comment.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Review Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: >
            
            /*************************************************************
             * CONTEXT
             *************************************************************/

            const owner = context.repo.owner;

            const repo = context.repo.repo;


            const pullNumber =
              context.payload.pull_request.number;

            const comment =
              context.payload.comment;

            const commentId =
              comment.id;

            const reviewer =
              comment.user.login;

            const rawBody =
              comment.body || "";

            console.log("=================================");

            console.log("Comment ID :", commentId);

            console.log("Reviewer   :", reviewer);

            console.log("=================================");


            /*************************************************************
             * IGNORE REPLY COMMENTS
             *************************************************************/

            if (comment.in_reply_to_id != null) {

              console.log(
                `Reply detected (reply to ${comment.in_reply_to_id}). Workflow skipped.`
              );

              return;

            }


            /*************************************************************
             * NORMALIZE MARKDOWN
             *************************************************************/

            function normalizeComment(text){

              return text

                // Remove HTML tags
                .replace(/<[^>]*>/g, " ")

                // Remove Markdown formatting
                .replace(/[*_`>#-]/g, " ")

                // Remove carriage returns
                .replace(/\r/g, " ")

                // Remove new lines
                .replace(/\n/g, " ")

                // Collapse whitespace
                .replace(/\s+/g, " ")

                // Convert to uppercase
                .toUpperCase()

                .trim();

            }


            const normalized =
              normalizeComment(rawBody);

            console.log("Normalized Comment:");

            console.log(normalized);


            /*************************************************************
             * LABEL DEFINITIONS
             *************************************************************/

            const RANKING = [

              "MAJOR",

              "MINOR"

            ];


            const CLASSIFICATIONS = [

              "MISSING",

              "EXTRA/SUPERFLUOUS",

              "AMBIGUOUS",

              "INCONSISTENT",

              "IMPROVEMENT DESIRABLE",

              "NOT CONFORMING TO STANDARDS",

              "RISK-PRONE",

              "FACTUALLY INCORRECT",

              "NOT IMPLEMENTABLE",

              "EDITORIAL"

            ];


            /*************************************************************
             * EXTRACT REVIEW STATE
             *************************************************************/

            function extractState(text){

              const state = {

                type: null,

                ranking: null,

                classification: null

              };

              /*
               * TYPE
               */

              if(/\[QUESTION\]/i.test(text)){

                state.type = "QUESTION";

              }

              if(/\[DEFECT\]/i.test(text)){

                state.type = "DEFECT";

              }

              /*
               * RANKING
               */

              for(const ranking of RANKING){

                const regex =
                  new RegExp("\\[" + ranking + "\\]", "i");

                if(regex.test(text)){

                  state.ranking = ranking;

                  break;

                }

              }

              /*
               * CLASSIFICATION
               */

              for(const classification of CLASSIFICATIONS){

                const escaped =
                  classification.replace("/", "\\/");

                const regex =
                  new RegExp("\\[" + escaped + "\\]", "i");

                if(regex.test(text)){

                  state.classification = classification;

                  break;

                }

              }

              return state;

            }


            const state =
              extractState(normalized);

            console.log("Detected State:");

            console.log(JSON.stringify(state, null, 2));
                        /*************************************************************
             * UNIQUE MARKER
             *************************************************************/

            const marker =
              `<!-- review-classifier:${commentId} -->`;

            /*************************************************************
             * BOT REPLY MANAGER
             *************************************************************/

            /**
             * Finds the existing bot reminder associated with
             * this review comment.
             */

            async function findBotReply() {

              let page = 1;

              while (true) {

                const response =
                  await github.rest.pulls.listReviewComments({

                    owner,
                    repo,
                    pull_number: pullNumber,

                    per_page: 100,

                    page

                  });

                const existingReply =
                  response.data.find(reply =>

                    reply.user.login === "github-actions[bot]" &&
                    reply.body &&
                    reply.body.includes(marker)

                  );

                if (existingReply) {

                  console.log(
                    `Existing bot reply found (${existingReply.id})`
                  );

                  return existingReply;

                }

                if (response.data.length < 100) {

                  break;

                }

                page++;

              }

              console.log("No existing bot reply found.");

              return null;

            }


            /*************************************************************
             * CREATE BOT REPLY
             *************************************************************/

            async function createReply(message){

              console.log("Creating bot reminder...");

              await github.rest.pulls.createReplyForReviewComment({

                owner,
                repo,

                pull_number: pullNumber,

                comment_id: commentId,

                body:

              `${marker}

              ${message}`

              });

            }


            /*************************************************************
             * UPDATE BOT REPLY
             *************************************************************/

            async function updateReply(

              replyId,

              message

            ){

              console.log(
                `Updating bot reminder ${replyId}`
              );

              await github.rest.pulls.updateReviewComment({

                owner,
                repo,

                comment_id: replyId,

                body:

                `${marker}

                ${message}`

              });

            }


            /*************************************************************
             * DELETE BOT REPLY
             *************************************************************/

            async function deleteReply(replyId){

              console.log(
                `Deleting bot reminder ${replyId}`
              );

              await github.rest.pulls.deleteReviewComment({

                owner,
                repo,

                comment_id: replyId

              });

            }


            /*************************************************************
             * SYNCHRONIZE BOT REPLY
             *
             * Empty reminder
             *      -> Delete reminder
             *
             * Non-empty reminder
             *      -> Update existing reminder
             *      -> Create reminder if none exists
             *************************************************************/

            async function syncBotReply(message){

              const reminder =
                message.trim();

              const existingReply =
                await findBotReply();

              /*
               * No reminder required
               */

              if(reminder.length === 0){

                if(existingReply){

                  await deleteReply(existingReply.id);

                }

                return;

              }

              /*
               * Reminder already exists
               */

              if(existingReply){

                if(existingReply.body.includes(reminder)){

                  console.log(
                    "Reminder already up-to-date."
                  );

                  return;

                }

                await updateReply(

                  existingReply.id,

                  reminder

                );

                return;

              }

              /*
               * Create new reminder
               */

              await createReply(reminder);

            }


            console.log(
              "Bot Reply Manager initialized."
            );
                        /*************************************************************
             * UI BUILDERS
             *************************************************************/

            /**
             * TYPE TABLE
             */

            function buildTypeTable() {

              return `
              👋 @${reviewer}

              Your review comment has not been classified yet.

              Please begin your review comment with **ONE** of the following labels.

              | Type | Description |
              |------|-------------|
              | **[QUESTION]** | Ask for clarification or raise a question |
              | **[DEFECT]** | Report a defect or issue |

              > **Note**
              >
              > If you choose **[DEFECT]**, you must also provide:
              >
              > - One **Ranking**
              > - One **Classification**
              `;

            }


            /**
             * RANKING TABLE
             */

            function buildRankingTable() {

              return `
                ## ❌ Ranking Required

                Please select **ONE** Ranking.

                | Ranking | Meaning |
                |---------|---------|
                | 🔴 **[MAJOR]** | Significant issue that should be resolved before merge |
                | 🟡 **[MINOR]** | Small issue with lower impact |

                `;

            }


            /**
             * CLASSIFICATION TABLE
             */

            function buildClassificationTable() {

              return `
                ## ❌ Classification Required

                Please select **ONE** Classification.

                | Classification | Description |
                |---------------|-------------|
                | **[MISSING]** | Required code or behaviour is missing |
                | **[EXTRA/SUPERFLUOUS]** | Unnecessary implementation exists |
                | **[AMBIGUOUS]** | Behaviour or implementation is unclear |
                | **[INCONSISTENT]** | Inconsistent with surrounding code |
                | **[IMPROVEMENT DESIRABLE]** | Improvement suggested |
                | **[NOT CONFORMING TO STANDARDS]** | Coding standards not followed |
                | **[RISK-PRONE]** | Risky implementation |
                | **[FACTUALLY INCORRECT]** | Incorrect behaviour |
                | **[NOT IMPLEMENTABLE]** | Suggested implementation is not feasible |
                | **[EDITORIAL]** | Grammar, wording or formatting issue |

                `;

            }


            /**
             * HEADER FOR DEFECT REMINDER
             */

            function buildReminderHeader() {

              return `
            👋 @${reviewer}


            Your **[DEFECT]** review comment requires additional information.


            `;


            }


            /**
             * FOOTER
             */

            function buildFooter(state){

              return `
            ---


            ### Current Status


            | Requirement | Status |

            |-------------|--------|

            | Type | ✅ ${state.type} |

            | Ranking | ${state.ranking ? "✅ " + state.ranking : "❌ Missing"} |

            | Classification | ${state.classification ? "✅ " +
            state.classification : "❌ Missing"} |


            `;

            }
                        /*************************************************************
             * BUILD DYNAMIC REMINDER
             *************************************************************/

            function buildReminder(state){

              /*******************************************************
               * CASE 1
               * No Type Selected
               *******************************************************/

              if(state.type === null){

                return buildTypeTable();

              }

              /*******************************************************
               * CASE 2
               * QUESTION
               *******************************************************/

              if(state.type === "QUESTION"){

                /*
                 * Questions require no additional labels.
                 * Delete any existing reminder.
                 */

                return "";

              }

              /*******************************************************
               * CASE 3
               * DEFECT COMPLETE
               *******************************************************/

              if(
                state.type === "DEFECT" &&
                state.ranking !== null &&
                state.classification !== null
              ){

                /*
                 * Fully classified.
                 * Delete any existing reminder.
                 */

                return "";

              }

              /*******************************************************
               * CASE 4
               * DEFECT
               *******************************************************/

              let reminder =
                buildReminderHeader();

              /*
               * Missing Ranking
               */

              if(state.ranking === null){

                reminder +=
                  buildRankingTable();

              }

              /*
               * Missing Classification
               */

              if(state.classification === null){

                reminder +=
                  buildClassificationTable();

              }

              /*
               * Current Status
               */

              reminder +=
                buildFooter(state);

              return reminder;

            }
